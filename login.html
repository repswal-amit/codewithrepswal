<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Login | code with repswal</title>

  <!-- Favicon -->
  <link rel="icon" href="assets/codewithrepswal.png" type="image/png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/login.css" />

  <!-- Firebase App (the core Firebase SDK) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <!-- Firebase Authentication -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <!-- Firebase Firestore -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>

<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 10px;">&lt;bca/&gt;</a>
        <h2>Admin Panel</h2>
        <p>Sign in to manage your portfolio</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="admin@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required />
        </div>

        <div id="loginError" class="login-error"></div>

        <button type="submit" class="btn btn-primary login-btn" id="loginBtn">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <script src="js/firebase-init.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');

    // Check if user is already logged in
    auth.onAuthStateChanged(user => {
      if (user) {
        window.location.href = 'admin.html'; // Redirect to admin panel
      }
    });

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      loginError.style.display = 'none';
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      loginBtn.innerHTML = 'Signing in...';
      loginBtn.disabled = true;

      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          // Signed in successfully, onAuthStateChanged will handle redirect
        })
        .catch((error) => {
          loginError.textContent = error.message;
          loginError.style.display = 'block';
          loginBtn.innerHTML = 'Sign In';
          loginBtn.disabled = false;
        });
    });
  </script>
</body>

</html>
